<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ecommerce de ropa" />
    <meta name="keywords" content="Zapatillas , Indumentaria , Accesorios" />
    <meta name="author" content="Octavio Fernandez , Leandro Blanca , Gonzalo Tabares" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <title>Digital Sport</title>
</head>

<body>
    <header>

    </header>
    <main>
        <section>
            <div id="carouselExampleIndicators" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"
                        aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4"
                        aria-label="Slide 5"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="/assets/img/carrusel.png" class="d-block w-100" alt="Dia de la madre">
                    </div>
                    <div class="carousel-item">
                        <img src="/assets/img/carrusel1.png" class="d-block w-100" alt="Nike zoom Air">
                    </div>
                    <div class="carousel-item">
                        <img src="/assets/img/carrusel2.png" class="d-block w-100" alt="Nike total 90">
                    </div>
                    <div class="carousel-item">
                        <img src="/assets/img/carrusel3.png" class="d-block w-100" alt="Indumentaria Boca">
                    </div>
                    <div class="carousel-item">
                        <img src="/assets/img/carrusel6.png" class="d-block w-100" alt="Indumentaria Deportiva">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>
    <footer>
        <div class="row">
            <p>Registrate y enterate de nuestras promociones antes que nadie!</p>
            <div class="mb-3">
                <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Tu correo electronico"
                    aria-describedby="emailHelp" style="width: 180px; height: 30px;" />
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
